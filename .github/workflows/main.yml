
name: SMusic Complete Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smusic-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug, Release APK and AAB
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK without setup-android action
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_HOME"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          # Accept Android SDK licenses
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          # Install required SDK packages
          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          # Verify installation
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"

          echo "Android SDK installation successful."

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Check signing secrets
      - name: Check Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Secret: $name"
              exit 1
            fi
          done

          echo "Signing secrets are configured."

      # 6. Decode release keystore
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app

          echo "$KEYSTORE_BASE64" \
            | base64 --decode > app/release.jks

          test -s app/release.jks

          echo "Release keystore created."

      # 7. Verify keystore
      - name: Verify Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore app/release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Keystore verification successful."

      # 8. Build Debug APK, Release APK and AAB
      - name: Build All Variants
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace clean \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      # 9. Verify release APK signatures
      - name: Verify Release APK Signatures
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          mapfile -t APKS < <(
            find app/build/outputs/apk/release \
              -type f -name "*.apk" | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APK found!"
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Verifying: $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done

          echo "All Release APK signatures verified."

      # 10. Verify AAB
      - name: Verify Release AAB
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t AABS < <(
            find app/build/outputs/bundle/release \
              -type f -name "*.aab" | sort
          )

          if [ "${#AABS[@]}" -eq 0 ]; then
            echo "No AAB found!"
            exit 1
          fi

          for AAB in "${AABS[@]}"; do
            echo "Verifying: $AAB"
            jarsigner -verify -verbose -certs "$AAB"
          done

          echo "AAB verification successful."

      # 11. Get app version
      - name: Get App Version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | sort | head -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK not found!"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"

          VERSION_NAME="$(echo "$BADGING" | \
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"

          VERSION_CODE="$(echo "$BADGING" | \
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION_NAME"
          echo "Version Code: $VERSION_CODE"

      # 12. Upload Release APK
      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-Release-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 30

      # 13. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-Debug-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 30

      # 14. Upload AAB
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-AAB-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 30

      # 15. Build summary
      - name: Build Summary
        if: success()
        run: |
          {
            echo "# SMusic Build Successful"
            echo ""
            echo "- Version: ${{ steps.version.outputs.version_name }}"
            echo "- Version Code: ${{ steps.version.outputs.version_code }}"
            echo "- Debug APK: Generated"
            echo "- Release APK: Signed and verified"
            echo "- AAB: Generated and verified"
          } >> "$GITHUB_STEP_SUMMARY"

      # 16. Cleanup keystore
      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f app/release.jks
          echo "Temporary keystore removed."
          
