name: SMusic Auto Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build Signed APKs + AAB
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. LATEST CODE
      # ==========================================
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. JAVA
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. GRADLE
      # ==========================================
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # ==========================================
      # 4. SIGNING KEY
      # ==========================================
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

      # ==========================================
      # 5. VERIFY KEYSTORE
      # ==========================================
      - name: Verify Release Keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # ==========================================
      # 6. CREATE TEMP ABI CONFIG
      # ==========================================
      - name: Configure ARM64 + Universal
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          marker = "android {"

          abi_config = r'''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = true
                  }
              }

          '''

          if "isUniversalApk = true" not in text:
              text = text.replace(
                  marker,
                  marker + "\n" + abi_config,
                  1
              )

          path.write_text(text)
          PY

      # ==========================================
      # 7. CLEAN EVERYTHING
      # ==========================================
      - name: Clean Project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean --no-daemon

      # ==========================================
      # 8. BUILD SIGNED APK
      # ==========================================
      - name: Build Signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      # ==========================================
      # 9. BUILD SIGNED AAB
      # ==========================================
      - name: Build Signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon

      # ==========================================
      # 10. SHOW OUTPUT
      # ==========================================
      - name: Show Build Files
        run: |
          echo "========== APK =========="
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          echo "========== AAB =========="
          find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -print

      # ==========================================
      # 11. UPLOAD ALL APKs
      # ==========================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ==========================================
      # 12. UPLOAD AAB
      # ==========================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
