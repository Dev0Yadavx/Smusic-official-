name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 1. Base64 secret se app folder me binary JKS file recreate karna
      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          ls -lh app/release.jks

      # 2. Release APK compile & sign karna
      - name: Build Release APK
        env:
          SIGNING_KEYSTORE_PATH: release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # 3. Output APK ko download artifact ki tarah upload karna
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicX-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
