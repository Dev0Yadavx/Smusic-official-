
name: SMusic All Architecture Auto Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smusic-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All Signed APKs
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout latest code
      - name: Checkout Latest Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Check project files
      - name: Check Project
        run: |
          echo "Project files:"
          ls -la
          echo "App Gradle file:"
          test -f app/build.gradle.kts

      # 5. Decode signing keystore
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/release.jks"

          test -s "$RUNNER_TEMP/release.jks"

      # 6. Verify keystore
      - name: Verify Keystore
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # 7. Configure all ABI APKs
      - name: Configure All Architectures
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          marker = "android {"

          if marker not in text:
              raise SystemExit("android block not found")

          if "isUniversalApk = true" not in text:

              config = '''
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include(
                          "armeabi-v7a",
                          "arm64-v8a",
                          "x86",
                          "x86_64"
                      )
                      isUniversalApk = true
                  }
              }
              '''

              position = text.index(marker) + len(marker)

              text = (
                  text[:position]
                  + "\n"
                  + config
                  + text[position:]
              )

              path.write_text(text)

          print("ABI configuration ready")
          PY

      # 8. Show Gradle file for debugging
      - name: Inspect Gradle Configuration
        run: |
          echo "First 35 lines of app/build.gradle.kts"
          nl -ba app/build.gradle.kts | head -35

      # 9. Clean project
      - name: Clean Project
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean --no-daemon

      # 10. Build signed APKs
      - name: Build All Release APKs
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon

      # 11. Build signed AAB
      - name: Build Release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon

      # 12. Verify outputs
      - name: Verify Release Files
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"

          echo "===== APK FILES ====="
          find "$APK_DIR" -name "*.apk" -print

          echo "===== AAB FILES ====="
          find "$AAB_DIR" -name "*.aab" -print

          test -n "$(find "$APK_DIR" -name "*.apk" -print -quit)"
          test -n "$(find "$AAB_DIR" -name "*.aab" -print -quit)"

      # 13. Upload APKs
      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-All-Architecture-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: SMusic-Android-App-Bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # 15. Build summary
      - name: Release Summary
        if: success()
        run: |
          echo "## SMusic Release Successful" >> "$GITHUB_STEP_SUMMARY"

          echo "### APK files" >> "$GITHUB_STEP_SUMMARY"

          find app/build/outputs/apk/release \
            -name "*.apk" \
            -printf '- %f\n' \
            >> "$GITHUB_STEP_SUMMARY"

          echo "### AAB files" >> "$GITHUB_STEP_SUMMARY"

          find app/build/outputs/bundle/release \
            -name "*.aab" \
            -printf '- %f\n' \
            >> "$GITHUB_STEP_SUMMARY"
            
